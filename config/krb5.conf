# /etc/krb5.conf -- login, compute and broker nodes (Active Directory realm)
[libdefaults]
    default_realm = CORP.EXAMPLE.MIL
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    forwardable = true
    renewable = true
    ticket_lifetime = 10h
    renew_lifetime = 7d
    # Tickets are used from many hosts (login + every compute node): no address binding.
    noaddresses = true
    # AD tickets carry a PAC; TCP avoids UDP fragmentation failures.
    udp_preference_limit = 1
    # AES only (the JDK rejects RC4/DES by default; AD accounts are enrolled AES-only).
    permitted_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    default_tkt_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    default_tgs_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    # Users get KRB5CCNAME=FILE:$HOME/.krb5/krb5cc_hpc from profile.d / TaskProlog.
    # FILE: ccache is what the daemon writes and what all clients here read.
    default_ccache_name = FILE:/tmp/krb5cc_%{uid}

[realms]
    CORP.EXAMPLE.MIL = {
        kdc = dc1.example.mil
        kdc = dc2.example.mil
        admin_server = dc1.example.mil
        kpasswd_server = dc1.example.mil
        # With constrained delegation the broker impersonates each user's REAL
        # AD identity, so service tickets already name the user (jdoe@REALM) and
        # no hpc-<user> prefix rewriting is needed. DEFAULT maps jdoe@REALM->jdoe.
        auth_to_local = DEFAULT
    }

[domain_realm]
    .corp.example.mil = CORP.EXAMPLE.MIL
    .hadoop.example.mil = CORP.EXAMPLE.MIL
