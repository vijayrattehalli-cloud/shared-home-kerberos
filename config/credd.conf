# /etc/krb-hpc/credd.conf  -- configuration for the Python krb-credd daemon
[broker]
realm            = CORP.EXAMPLE.MIL          ; the enterprise AD realm
krb5_conf        = /etc/krb5.conf
keytab_dir       = /etc/krb-hpc/keytabs      ; root 0700, one escrowed AD keytab per user
state_dir        = /var/lib/krb-hpc/ccache   ; root 0700, master copies
map_file         = /etc/krb-hpc/uidmap.conf
unix_socket      = /run/krb-hpc/credd.sock
; where each user's ticket lives. Tokens: {home} {uid} {user}.
; MUST be on the filesystem the compute nodes mount (NFS/GPFS/Lustre home).
ccache_path      = {home}/.krb5/krb5cc_hpc
install_helper   = /usr/local/libexec/krb-hpc/krb-install-ccache
setpriv          = /usr/bin/setpriv
ticket_lifetime  = 10h
renew_lifetime   = 7d
renew_margin     = 2h
refresh_interval = 5m
active_window    = 7d
watch_slurm      = true
squeue           = /usr/bin/squeue
