# /etc/krb-hpc/credd.conf  -- configuration for the Python krb-credd daemon
# (constrained-delegation / S4U edition).
#
# The daemon authenticates ONCE as a single broker service account and uses
# Kerberos constrained delegation (S4U2Self + S4U2Proxy) to mint per-user
# SERVICE tickets to the enumerated backends. There are no per-user keytabs.
[broker]
realm            = CORP.EXAMPLE.MIL          ; the enterprise AD realm
krb5_conf        = /etc/krb5.conf

; --- the ONE credential this daemon holds ---
broker_principal = hpc-broker/hpc-mgmt.corp.example.mil
broker_keytab    = /etc/krb-hpc/broker.keytab   ; root 0600; ideally HSM/gMSA-backed
broker_ccache    = /var/lib/krb-hpc/broker.cc   ; the broker's own TGT (renewable)

; --- constrained-delegation targets ---
; The SPNs the daemon is permitted to obtain tickets to on a user's behalf.
; These MUST match the service principals listed in the broker account's
; msDS-AllowedToDelegateTo in AD. Space- or comma-separated; {host} is NOT
; expanded -- list each concrete SPN. Add every Kerberized DAE backend here.
delegate_targets = hive/hiveserver2.corp.example.mil@CORP.EXAMPLE.MIL hdfs/namenode.corp.example.mil@CORP.EXAMPLE.MIL

state_dir        = /var/lib/krb-hpc/ccache   ; root 0700, master copies
map_file         = /etc/krb-hpc/uidmap.conf  ; uid/name -> REAL AD user principal
unix_socket      = /run/krb-hpc/credd.sock

; where each user's ticket cache lives. Tokens: {home} {uid} {user}.
; MUST be on the filesystem the compute nodes mount (NFS/GPFS/Lustre home).
ccache_path      = {home}/.krb5/krb5cc_hpc

install_helper   = /usr/local/libexec/krb-hpc/krb-install-ccache
setpriv          = /usr/bin/setpriv

; MIT Kerberos tools, run by absolute path (never looked up on PATH). Each must
; be root-owned and not group/world writable. MIT krb5 1.19+ is required
; (kvno --out-cache); the daemon checks `klist -V` at start-up.
kinit            = /usr/bin/kinit
klist            = /usr/bin/klist
kvno             = /usr/bin/kvno
; How the user's name is sent in S4U2Self: "enterprise" (kvno -U; AD resolves
; sAMAccountName or UPN -- the historical behavior) or "principal" (kvno -I; a
; plain user@REALM principal).
s4u_name_type    = enterprise

; Service tickets are re-minted (not renewed) before they expire; the broker's
; OWN TGT is what renews/re-acquires unattended from the keytab.
broker_lifetime  = 10h
broker_renew     = 7d
renew_margin     = 1h          ; re-mint user tickets this long before expiry
min_reissue_interval = 10s     ; throttle: min seconds between re-copying into $HOME
refresh_interval = 5m
refresh_workers  = 4           ; users refreshed in parallel per pass
active_window    = 7d
watch_slurm      = true
squeue           = /usr/bin/squeue

; --- safety controls ---
; Never serve accounts below this UID (root, system and service accounts),
; even if someone enrolls one by mistake. Default: UID_MIN from /etc/login.defs.
min_uid          = 1000
; Kill switch: while this file exists, krb-credd mints and installs nothing
; (krb-get is refused, background refresh pauses). `touch` it to stop issuance
; at once without a restart; remove it to resume. Tickets already issued stay
; valid until they expire.
disable_file     = /etc/krb-hpc/disabled
; After a failed mint for a user, answer that user's requests with the same
; error for this long instead of asking AD again.
failure_cooldown = 60s
; Checks on every freshly minted cache before it is used: "enforce" (default)
; or "warn". warn relaxes only the name checks (unexpected principal name,
; missing target) while you sort out uidmap name formats; a TGT, a different
; client, a non-AES session key or a too-short lifetime are always refused.
ticket_checks    = enforce
