# /etc/krb-hpc/uidmap.conf  (root:root 0644)
# Maps an HPC POSIX identity to the user's REAL Active Directory principal.
# The broker impersonates this identity via constrained delegation (S4U), so it
# is the user's own sAMAccountName/UPN -- NOT an hpc-<user> shadow account.
# The account must be delegation-eligible (not in Protected Users, not flagged
# "sensitive -- cannot be delegated"). See AD-SETUP.md.
#
# Write the account's sAMAccountName (bare, or name@REALM): that is the client
# name AD puts in the tickets, and since 2.3.0 the daemon refuses a minted cache
# that names anyone else. A UPN alias that differs from the sAMAccountName
# (e.g. john.doe@corp.example.mil for jdoe) will be rejected as bad_ticket.
#
# <HPC username or uid>   <real AD principal; bare name = default realm>
jdoe        jdoe
21003       asmith
# cross-realm user: write the principal fully qualified
# 21009     bturner@OTHER.EXAMPLE.MIL
