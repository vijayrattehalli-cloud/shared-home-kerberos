# krb-credd (Java 24) configuration  -- /etc/krb-hpc/credd.properties
realm            = HPC.EXAMPLE.MIL
krb5_conf        = /etc/krb5.conf
keytab_dir       = /etc/krb-hpc/keytabs
uid_map          = /etc/krb-hpc/uidmap.conf
socket           = /run/krb-hpc/credd.sock

# Where each user's TGT lives. Tokens: {home} {uid} {user}
# Must be on the filesystem the compute nodes mount (NFS/GPFS/Lustre home).
ccache_path      = {home}/.krb5/krb5cc_hpc
install_helper   = /usr/local/libexec/krb-hpc/krb-install-ccache
setpriv          = /usr/bin/setpriv

# Refresh loop: renew when less than renew_margin remains; re-acquire from the
# keytab once past renew-till. Users stay "active" for active_window after
# their last krb-get, and for as long as they have Slurm jobs (watch_slurm).
refresh_interval = 5m
renew_margin     = 2h
active_window    = 7d
watch_slurm      = true
squeue           = /usr/bin/squeue
