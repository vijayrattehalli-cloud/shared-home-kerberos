<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1000" viewBox="0 0 1560 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1560" height="1000" fill="#FFFFFF"/>
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F3A5F" flood-opacity="0.18"/></filter>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A7FA6"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F7B3F"/></marker>
<marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A5A00"/></marker>
</defs>
<rect x="0" y="0" width="1560" height="76" fill="#1F3A5F"/>
<text x="40" y="38" fill="#FFFFFF" font-size="27" font-weight="700">Secure Data Access for HPC Jobs — Executive Data Flow</text>
<text x="40" y="62" fill="#C7D6E8" font-size="15">How a user’s identity becomes a short-lived access pass that follows their job to every machine and every data service</text>
<g filter="url(#sh)"><rect x="556" y="150" width="222" height="100" rx="12" fill="#FDF6E9" stroke="#8A5A00" stroke-width="2"/></g>
<text x="667.0" y="180" text-anchor="middle" fill="#8A5A00" font-size="17" font-weight="700">Active Directory</text>
<text x="667.0" y="202" text-anchor="middle" fill="#5B6B7B" font-size="12.5">Enterprise identity provider</text>
<text x="667.0" y="218" text-anchor="middle" fill="#5B6B7B" font-size="12.5">— issues the access pass</text>
<rect x="613" y="227" width="108" height="16" rx="8" fill="#FDF6E9"/>
<text x="667.0" y="239" text-anchor="middle" fill="#8A5A00" font-size="10.5" font-weight="700">EXTERNAL · KDC</text>
<g filter="url(#sh)"><rect x="40" y="470" width="214" height="126" rx="12" fill="#FFFFFF" stroke="#2E5984" stroke-width="2"/></g>
<text x="147.0" y="500" text-anchor="middle" fill="#1F3A5F" font-size="17" font-weight="700">User at a Windows PC</text>
<text x="147.0" y="522" text-anchor="middle" fill="#5B6B7B" font-size="12.5">Signs in with the CAC</text>
<text x="147.0" y="538" text-anchor="middle" fill="#5B6B7B" font-size="12.5">smartcard, authenticated</text>
<text x="147.0" y="554" text-anchor="middle" fill="#5B6B7B" font-size="12.5">by Active Directory</text>
<rect x="119" y="573" width="56" height="16" rx="8" fill="#EAF1F8"/>
<text x="147.0" y="585" text-anchor="middle" fill="#2E5984" font-size="10.5" font-weight="700">PERSON</text>
<g filter="url(#sh)"><rect x="300" y="470" width="214" height="126" rx="12" fill="#FFFFFF" stroke="#2E5984" stroke-width="2"/></g>
<text x="407.0" y="500" text-anchor="middle" fill="#1F3A5F" font-size="17" font-weight="700">HPC Login Node</text>
<text x="407.0" y="522" text-anchor="middle" fill="#5B6B7B" font-size="12.5">Reached by CAC / PuTTY /</text>
<text x="407.0" y="538" text-anchor="middle" fill="#5B6B7B" font-size="12.5">SSH. Knows the user only</text>
<text x="407.0" y="554" text-anchor="middle" fill="#5B6B7B" font-size="12.5">by a numeric ID (UID)</text>
<rect x="366" y="573" width="82" height="16" rx="8" fill="#EAF1F8"/>
<text x="407.0" y="585" text-anchor="middle" fill="#2E5984" font-size="10.5" font-weight="700">HPC · OURS</text>
<g filter="url(#sh)"><rect x="560" y="454" width="214" height="158" rx="12" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/></g>
<text x="667.0" y="484" text-anchor="middle" fill="#1F3A5F" font-size="17" font-weight="700">Credential Broker</text>
<text x="667.0" y="505" text-anchor="middle" fill="#1F3A5F" font-size="17" font-weight="700">(krb-credd)</text>
<text x="667.0" y="527" text-anchor="middle" fill="#5B6B7B" font-size="12.5">Obtains the user’s access</text>
<text x="667.0" y="543" text-anchor="middle" fill="#5B6B7B" font-size="12.5">pass from AD on their</text>
<text x="667.0" y="559" text-anchor="middle" fill="#5B6B7B" font-size="12.5">behalf; keeps it current</text>
<rect x="619" y="589" width="95" height="16" rx="8" fill="#EAF1F8"/>
<text x="667.0" y="601" text-anchor="middle" fill="#2E5984" font-size="10.5" font-weight="700">CORE SERVICE</text>
<g filter="url(#sh)">
<path d="M825,475 a107.0,13 0 0 1 214,0 v116 a107.0,13 0 0 1 -214,0 z" fill="#E3F2E9" stroke="#0F7B3F" stroke-width="2"/>
<ellipse cx="932.0" cy="475" rx="107.0" ry="13" fill="#F2FAF4" stroke="#0F7B3F" stroke-width="2"/>
</g>
<text x="932.0" y="506" text-anchor="middle" fill="#0F7B3F" font-size="16" font-weight="700">Shared Home Storage</text>
<text x="932.0" y="526" text-anchor="middle" fill="#2E6B46" font-size="12.5">The pass at rest in the</text>
<text x="932.0" y="542" text-anchor="middle" fill="#2E6B46" font-size="12.5">user’s folder, mounted</text>
<text x="932.0" y="558" text-anchor="middle" fill="#2E6B46" font-size="12.5">by every compute node</text>
<rect x="880.0" y="582" width="104" height="16" rx="8" fill="#E3F2E9"/><text x="932.0" y="594" text-anchor="middle" fill="#0F7B3F" font-size="10.5" font-weight="700">DATA AT REST</text>
<g filter="url(#sh)"><rect x="1099" y="484" width="214" height="126" rx="12" fill="#FDFEFF" stroke="#9DB6D1" stroke-width="2"/></g>
<g filter="url(#sh)"><rect x="1092" y="477" width="214" height="126" rx="12" fill="#FDFEFF" stroke="#8AA7C8" stroke-width="2"/></g>
<g filter="url(#sh)"><rect x="1085" y="470" width="214" height="126" rx="12" fill="#FFFFFF" stroke="#2E5984" stroke-width="2"/></g>
<text x="1192.0" y="500" text-anchor="middle" fill="#1F3A5F" font-size="17" font-weight="700">Compute Nodes</text>
<text x="1192.0" y="522" text-anchor="middle" fill="#5B6B7B" font-size="12.5">Every machine of the</text>
<text x="1192.0" y="538" text-anchor="middle" fill="#5B6B7B" font-size="12.5">Slurm job — each reads</text>
<text x="1192.0" y="554" text-anchor="middle" fill="#5B6B7B" font-size="12.5">the same access pass</text>
<rect x="1154" y="573" width="75" height="16" rx="8" fill="#EAF1F8"/>
<text x="1192.0" y="585" text-anchor="middle" fill="#2E5984" font-size="10.5" font-weight="700">SLURM JOB</text>
<g filter="url(#sh)"><rect x="1300" y="470" width="214" height="126" rx="12" fill="#FDF6E9" stroke="#8A5A00" stroke-width="2"/></g>
<text x="1407.0" y="500" text-anchor="middle" fill="#8A5A00" font-size="17" font-weight="700">Kerberized Data</text>
<text x="1407.0" y="521" text-anchor="middle" fill="#8A5A00" font-size="17" font-weight="700">Services</text>
<text x="1407.0" y="543" text-anchor="middle" fill="#5B6B7B" font-size="12.5">Hive, HDFS and more —</text>
<text x="1407.0" y="559" text-anchor="middle" fill="#5B6B7B" font-size="12.5">access needs a valid pass</text>
<rect x="1356" y="573" width="102" height="16" rx="8" fill="#FDF6E9"/>
<text x="1407.0" y="585" text-anchor="middle" fill="#8A5A00" font-size="10.5" font-weight="700">EXTERNAL DATA</text>
<path d="M254,533.0 L300,533.0" fill="none" stroke="#5A7FA6" stroke-width="3" marker-end="url(#arr)"/>
<circle cx="277.0" cy="533.0" r="13" fill="#2E5984" stroke="#fff" stroke-width="2"/><text x="277.0" y="537.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">1</text>
<path d="M514,533.0 L560,533.0" fill="none" stroke="#5A7FA6" stroke-width="3" marker-end="url(#arr)"/>
<circle cx="537.0" cy="533.0" r="13" fill="#2E5984" stroke="#fff" stroke-width="2"/><text x="537.0" y="537.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">2</text>
<path d="M651.0,454 L651.0,250" fill="none" stroke="#8A5A00" stroke-width="3" marker-end="url(#arrT)"/>
<path d="M683.0,250 L683.0,454" fill="none" stroke="#0F7B3F" stroke-width="3" marker-end="url(#arrA)"/>
<circle cx="667.0" cy="355" r="13" fill="#8A5A00" stroke="#fff" stroke-width="2"/><text x="667.0" y="359.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">3</text>
<text x="641.0" y="320" text-anchor="end" fill="#8A5A00" font-size="12" font-weight="600">authenticate</text>
<text x="693.0" y="320" text-anchor="start" fill="#0F7B3F" font-size="12" font-weight="600">access pass</text>
<path d="M774,533.0 L825,533.0" fill="none" stroke="#0F7B3F" stroke-width="3" marker-end="url(#arrA)"/>
<circle cx="799.5" cy="533.0" r="13" fill="#0F7B3F" stroke="#fff" stroke-width="2"/><text x="799.5" y="537.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">4</text>
<path d="M1039,533.0 L1085,533.0" fill="none" stroke="#0F7B3F" stroke-width="3" marker-end="url(#arrA)"/>
<circle cx="1062.0" cy="533.0" r="13" fill="#0F7B3F" stroke="#fff" stroke-width="2"/><text x="1062.0" y="537.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">5</text>
<path d="M1299,533.0 L1300,533.0" fill="none" stroke="#5A7FA6" stroke-width="3" marker-end="url(#arr)"/>
<circle cx="1299.5" cy="533.0" r="13" fill="#2E5984" stroke="#fff" stroke-width="2"/><text x="1299.5" y="537.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">6</text>
<path d="M580,612 q-52,30 4,52 q 184,26 180,-14" fill="none" stroke="#0F7B3F" stroke-width="2.4" stroke-dasharray="5 5" marker-end="url(#arrA)"/>
<circle cx="667.0" cy="654" r="13" fill="#0F7B3F" stroke="#fff" stroke-width="2"/><text x="667.0" y="658.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">7</text>
<rect x="40" y="720" width="1480" height="248" rx="12" fill="#F7FAFD" stroke="#D5E0ED" stroke-width="1.5"/>
<text x="64" y="754" fill="#1F3A5F" font-size="16" font-weight="700">How it works — the steps</text>
<circle cx="78" cy="774" r="11" fill="#2E5984"/><text x="78" y="778" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="700">1</text>
<text x="98" y="778" fill="#1A2430" font-size="13">User signs in to the login node with their CAC (as they do today).</text>
<circle cx="78" cy="799" r="11" fill="#2E5984"/><text x="78" y="803" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="700">2</text>
<text x="98" y="803" fill="#1A2430" font-size="13">The login node asks the Credential Broker for that user’s pass.</text>
<circle cx="78" cy="824" r="11" fill="#0F7B3F"/><text x="78" y="828" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="700">3</text>
<text x="98" y="828" fill="#1A2430" font-size="13">The Broker authenticates to Active Directory and receives the pass.</text>
<circle cx="78" cy="849" r="11" fill="#0F7B3F"/><text x="78" y="853" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="700">4</text>
<text x="98" y="853" fill="#1A2430" font-size="13">The Broker writes the pass into the user’s home folder, as the user.</text>
<circle cx="78" cy="874" r="11" fill="#0F7B3F"/><text x="78" y="878" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="700">5</text>
<text x="98" y="878" fill="#1A2430" font-size="13">Because home is shared, every compute node already sees the pass.</text>
<circle cx="78" cy="899" r="11" fill="#2E5984"/><text x="78" y="903" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="700">6</text>
<text x="98" y="903" fill="#1A2430" font-size="13">Each task shows the pass to the data services and reads its data.</text>
<circle cx="78" cy="924" r="11" fill="#0F7B3F"/><text x="78" y="928" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="700">7</text>
<text x="98" y="928" fill="#1A2430" font-size="13">The Broker keeps the pass fresh for as long as the job runs.</text>
<line x1="760" y1="740" x2="760" y2="948" stroke="#D5E0ED" stroke-width="1.5"/>
<text x="780" y="754" fill="#1F3A5F" font-size="16" font-weight="700">What flows across every arrow</text>
<text x="780" y="780" fill="#1A2430" font-size="13.5">One thing moves through the system: the user’s</text>
<text x="780" y="800" fill="#1A2430" font-size="13.5"><tspan font-weight="700" fill="#0F7B3F">access pass</tspan> — a short-lived Kerberos ticket that proves</text>
<text x="780" y="820" fill="#1A2430" font-size="13.5">who they are. It is never a password, is created only after</text>
<text x="780" y="840" fill="#1A2430" font-size="13.5">authentication, and expires on its own.</text>
<rect x="780" y="858" width="22" height="15" rx="4" fill="#FDF6E9" stroke="#8A5A00" stroke-width="2"/>
<text x="808" y="870" fill="#1A2430" font-size="12.5">Person / external data</text>
<rect x="986.6" y="858" width="22" height="15" rx="4" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
<text x="1014.6" y="870" fill="#1A2430" font-size="12.5">HPC service (ours)</text>
<rect x="780" y="884" width="22" height="15" rx="4" fill="#E3F2E9" stroke="#0F7B3F" stroke-width="2"/>
<text x="808" y="896" fill="#1A2430" font-size="12.5">Data at rest</text>
<rect x="913.6" y="884" width="22" height="15" rx="4" fill="#FFFFFF" stroke="#0F7B3F" stroke-width="2"/>
<text x="941.6" y="896" fill="#1A2430" font-size="12.5">Access-pass flow</text>
<text x="780" y="946" fill="#2E5984" font-size="12.5" font-style="italic">Takeaway: users keep using their CAC; each job automatically gets a</text>
<text x="780" y="964" fill="#2E5984" font-size="12.5" font-style="italic" dy="0">temporary, self-expiring pass — no stored passwords, no manual steps.</text>
</svg>