# Apache vhost that does the SPNEGO handshake and reverse-proxies to the
# lakeFS credential broker, passing the authenticated principal as REMOTE_USER.
#
#   apt install libapache2-mod-auth-gssapi   (or mod_auth_gssapi on EL)
#   a2enmod auth_gssapi headers proxy proxy_http
#
# The broker's service principal (HTTP/<this-host>@REALM) and keytab are what
# the clients' krb-credd-minted tickets target. Keep the broker bound to
# 127.0.0.1 so it is reachable ONLY through this proxy.

<VirtualHost *:443>
    ServerName lakefs-sts.corp.example.mil

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/lakefs-sts.crt
    SSLCertificateKeyFile /etc/ssl/private/lakefs-sts.key

    <Location "/credentials">
        AuthType GSSAPI
        AuthName "lakeFS credential broker"
        # Accept Kerberos only (no NTLM/Basic fallback):
        GssapiAllowedMech krb5
        GssapiCredStore keytab:/etc/krb5.keytab
        # Use the SPN of THIS host; clients request HTTP/<host>@REALM:
        # GssapiAcceptorName HTTP/lakefs-sts.corp.example.mil
        GssapiLocalName On            # set REMOTE_USER to the local name (strip @REALM)
        Require valid-user

        # Hand the broker the authenticated principal; it trusts REMOTE_USER.
        RequestHeader set X-Remote-User "%{REMOTE_USER}s"
        ProxyPass        http://127.0.0.1:8640/credentials
        ProxyPassReverse http://127.0.0.1:8640/credentials
    </Location>

    <Location "/healthz">
        ProxyPass        http://127.0.0.1:8640/healthz
        ProxyPassReverse http://127.0.0.1:8640/healthz
    </Location>
</VirtualHost>

# Run the broker (behind this proxy) with, e.g.:
#   BROKER_LISTEN=127.0.0.1:8640 \
#   BROKER_REMOTE_USER_SOURCE=header:X-Remote-User \
#   BROKER_TRUSTED_PROXIES=127.0.0.1 \
#   LAKEFS_ENDPOINT=https://lakefs.corp.example.mil:8000 \
#   LAKEFS_ADMIN_ACCESS_KEY_ID=... LAKEFS_ADMIN_SECRET_ACCESS_KEY=... \
#   gunicorn -b 127.0.0.1:8640 lakefs_cred_broker:app
