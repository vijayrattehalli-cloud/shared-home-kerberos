[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "krbhpc-shared-home"
version = "2.1.0"
description = "krb-credd: a Kerberos client broker (root) for a CAC / UID-GID HPC cluster -- S4U constrained-delegation client of Active Directory, shared-home ticket delivery (pure Python)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "krb-hpc contributors" }]
dependencies = []                      # stdlib only; MIT krb5 + setpriv are system tools

[project.optional-dependencies]
hive = ["impyla[kerberos]>=0.18"]      # only for the Python Hive client
dev  = ["pytest>=7"]

[project.scripts]
krb-credd = "krbhpc.credd:main"
krb-get = "krbhpc.get:main"
krb-install-ccache = "krbhpc.install_ccache:main"

[tool.setuptools.packages.find]
where = ["src"]
